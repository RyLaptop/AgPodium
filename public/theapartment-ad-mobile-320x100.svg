  <line x1="36" y1="36" x2="36" y2="64" stroke="#EDE5D3" stroke-width="2"/>
  <line x1="22" y1="50" x2="50" y2="50" stroke="#EDE5D3" stroke-width="2"/>

  <!-- brand micro-line -->
