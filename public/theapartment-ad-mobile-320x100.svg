<svg width="320" height="100" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;family=Fraunces:wght@800&amp;display=swap');
    </style>
  </defs>

  <!-- background -->
  <rect width="320" height="100" fill="#EDE5D3"/>

  <!-- badge -->
